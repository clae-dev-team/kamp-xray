<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-ray 이물 검사</title>
<style>
  :root {
    --bg: #0e1316; --panel: #151c20; --line: #242e34; --line-soft: #1c252a;
    --text: #e8eef0; --sub: #93a3ab; --faint: #5f6f77;
    --ok: #35c2a4; --hold: #f0a63c; --ng: #ef5b52; --risk: #e8943a; --truth: #cfd8dc;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 Pretendard, "Malgun Gothic", sans-serif; letter-spacing: -0.01em;
    display: grid; grid-template-rows: 60px 1fr; overflow: hidden;
  }
  button, select { font: inherit; color: inherit; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }

  header {
    display: flex; align-items: center; gap: 20px; padding: 0 24px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; font-weight: 700; margin: 0; }
  header .model { color: var(--sub); font-size: 13px; }
  .tally { margin-left: auto; display: flex; gap: 22px; font-size: 13px; color: var(--sub); }
  .tally b { font-family: var(--mono); font-weight: 600; font-size: 15px; margin-left: 6px; color: var(--text); }
  .tally .ok b { color: var(--ok); } .tally .hold b { color: var(--hold); } .tally .ng b { color: var(--ng); }

  main { display: grid; grid-template-columns: 324px minmax(0, 1fr) 372px; min-height: 0; }

  /* 왼쪽: 사진 목록 */
  .list { border-right: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  .tabs { display: flex; padding: 14px 16px 10px; gap: 4px; }
  .tabs button { flex: 1; white-space: nowrap; }
  .tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 0 8px;
    color: var(--sub); cursor: pointer; font-size: 13px; font-weight: 500;
  }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }
  .rows { overflow-y: auto; padding: 0 8px 8px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .row {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center;
    width: 100%; padding: 7px 8px; border: 0; border-radius: 8px; background: none; cursor: pointer; text-align: left;
  }
  .row:hover { background: var(--line-soft); }
  .row[aria-current="true"] { background: #1e2a30; }
  .row img { width: 56px; height: 44px; object-fit: cover; border-radius: 4px; display: block; background: #000; }
  .row .t1 { font-size: 13px; font-weight: 500; }
  .row .t2 { font-size: 12px; color: var(--sub); font-family: var(--mono); letter-spacing: 0; }
  .row .sc { font-family: var(--mono); font-size: 12px; color: var(--sub); letter-spacing: 0; padding-right: 4px; }
  .row .dot { margin-right: 2px; }
  .grp { padding: 12px 8px 6px; font-size: 11.5px; font-weight: 600; color: var(--faint); letter-spacing: 0.02em; display: flex; justify-content: space-between; }
  .grp:first-child { padding-top: 2px; }
  .grp b { font-family: var(--mono); font-weight: 500; letter-spacing: 0; }
  .grp.auto { border-top: 1px solid var(--line); margin-top: 8px; color: var(--sub); font-weight: 400; }
  .qhead { padding: 0 16px 8px; font-size: 12px; color: var(--faint); display: flex; justify-content: space-between; align-items: center; }
  .qhead button { background: none; border: 1px solid var(--line); border-radius: 12px; padding: 2px 10px; font-size: 12px; color: var(--sub); cursor: pointer; }
  .qhead button:hover { border-color: var(--faint); color: var(--text); }
  .list { grid-template-rows: auto auto 1fr auto !important; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: transparent; }
  .dot.합격 { background: var(--ok); } .dot.재검사 { background: var(--hold); } .dot.불합격 { background: var(--ng); }
  .upload { border-top: 1px solid var(--line); padding: 14px 16px 16px; display: grid; grid-template-columns: 1fr 88px; gap: 8px; }
  .upload label, .upload select {
    height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; font-weight: 500;
  }
  .upload select { padding: 0 8px; }
  .upload label:hover { border-color: var(--faint); }
  .upload input { display: none; }
  .upload p { grid-column: 1 / -1; margin: 2px 0 0; font-size: 12px; color: var(--faint); }

  /* 가운데: 사진 */
  .view { display: grid; grid-template-rows: 52px 1fr; min-height: 0; min-width: 0; }
  .bar { display: flex; align-items: center; gap: 18px; padding: 0 24px; border-bottom: 1px solid var(--line); }
  .bar .name { font-size: 13.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toggles { margin-left: auto; display: flex; gap: 6px; flex: none; }
  .toggles button {
    display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 15px;
    border: 1px solid var(--line); background: none; cursor: pointer; font-size: 12.5px; color: var(--faint);
  }
  .toggles button i { width: 9px; height: 9px; border-radius: 2px; background: var(--faint); }
  .toggles button[aria-pressed="true"] { color: var(--text); border-color: #3a474e; }
  .toggles button[aria-pressed="true"] i.b { background: var(--hold); }
  .toggles button[aria-pressed="true"] i.r { background: var(--risk); }
  .toggles button[aria-pressed="true"] i.t { background: none; border: 1px dashed var(--truth); }
  .stage { position: relative; min-height: 0; display: grid; place-items: center; padding: 24px; }
  #main { display: block; border-radius: 4px; }
  .lens {
    position: absolute; right: 24px; bottom: 24px; width: 168px; padding: 8px 8px 6px;
    background: rgba(14, 19, 22, .92); border: 1px solid var(--line); border-radius: 10px;
  }
  .lens canvas { width: 152px; height: 152px; display: block; border-radius: 4px; image-rendering: pixelated; }
  .lens div { font-size: 11.5px; color: var(--sub); margin-top: 5px; text-align: center; }
  .empty { color: var(--faint); font-size: 14px; }

  /* 오른쪽: 판정 */
  .side { border-left: 1px solid var(--line); overflow-y: auto; padding: 26px 28px 24px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .verdict { font-size: 46px; font-weight: 800; line-height: 1.1; letter-spacing: -0.03em; }
  .verdict.합격 { color: var(--ok); } .verdict.재검사 { color: var(--hold); } .verdict.불합격 { color: var(--ng); }
  .why { color: var(--sub); margin: 8px 0 0; min-height: 42px; }
  h2 { font-size: 12px; font-weight: 600; color: var(--faint); margin: 28px 0 10px; letter-spacing: 0.02em; }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { font-family: var(--mono); font-size: 11px; fill: var(--sub); }
  svg text.k { font-family: Pretendard, "Malgun Gothic", sans-serif; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { font-weight: 500; color: var(--faint); font-size: 12px; text-align: left; padding: 0 0 6px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  th.r, td.r { text-align: right; }
  tr.sig { cursor: pointer; }
  tr.sig:hover td { background: var(--line-soft); }
  tr.sig[aria-selected="true"] td:first-child { color: var(--text); font-weight: 700; }
  td.no { width: 26px; color: var(--faint); font-family: var(--mono); }
  td.sc { width: 58px; font-family: var(--mono); }
  td.vd { width: 58px; font-weight: 600; }
  td.vd.재검사 { color: var(--hold); } td.vd.불합격 { color: var(--ng); }
  td.at { color: var(--sub); padding-left: 14px; }
  .none { color: var(--sub); font-size: 13px; }
  .meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 8px 0 8px; }
  .meter i { display: block; height: 100%; background: var(--risk); border-radius: 3px; }
  .big { font-family: var(--mono); font-size: 22px; font-weight: 600; letter-spacing: 0; }
  .big small { font-family: Pretendard, "Malgun Gothic", sans-serif; font-size: 13px; font-weight: 400; color: var(--sub); margin-left: 8px; }
  .note { font-size: 12.5px; color: var(--faint); margin: 0; }
  .kv { display: grid; grid-template-columns: 1fr auto; row-gap: 6px; font-size: 13px; color: var(--sub); }
  .kv b { font-family: var(--mono); font-weight: 500; color: var(--text); text-align: right; }

  /* 머리줄 단추 */
  .tools { display: flex; gap: 8px; margin-left: 8px; }
  .tools button { height: 30px; padding: 0 13px; border-radius: 15px; border: 1px solid var(--line); background: none; cursor: pointer; font-size: 12.5px; color: var(--sub); }
  .tools button:hover { border-color: var(--faint); color: var(--text); }
  .tools button[hidden] { display: none; }
  .tally { margin-left: auto; }

  /* 작업자 확정 */
  .confirm { margin: 16px 0 0; }
  .confirm[hidden] { display: none; }
  .confirm .ask { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .confirm .ask button { height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 13.5px; font-weight: 600; }
  .confirm .ask button kbd { font: 500 11px var(--mono); color: var(--faint); margin-left: 7px; }
  .confirm .ask .yes:hover { border-color: var(--ng); color: var(--ng); }
  .confirm .ask .no:hover { border-color: var(--ok); color: var(--ok); }
  .confirm .done { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 14px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-size: 13.5px; }
  .confirm .done b.이물 { color: var(--ng); } .confirm .done b.정상 { color: var(--ok); }
  .confirm .done button { background: none; border: 0; color: var(--faint); cursor: pointer; font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; }
  .confirm p { margin: 7px 0 0; font-size: 12px; color: var(--faint); }
  .row .ck { font: 600 11px var(--mono); padding-right: 4px; }
  .row .ck.이물 { color: var(--ng); } .row .ck.정상 { color: var(--ok); }

  /* 창: 자가 점검 · 교대 보고서 */
  dialog { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 0; max-height: 94vh; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
  dialog::backdrop { background: rgba(5, 8, 10, .68); }
  .dlg { padding: 26px 32px 24px; }
  .dlg h3 { margin: 0; font-size: 20px; font-weight: 700; }
  .dlg .lead { margin: 6px 0 0; color: var(--sub); font-size: 13.5px; }
  .dlg .acts { display: flex; gap: 8px; margin-top: 24px; justify-content: flex-end; }
  .dlg .acts button, .dlg .acts select { height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 13px; font-weight: 500; }
  .dlg .acts button.go { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
  .dlg .acts button:disabled { opacity: .5; cursor: default; }
  .dlg .acts .sp { margin-right: auto; }
  #dlg-check { width: 520px; }
  .pieces { display: grid; grid-template-columns: repeat(20, 1fr); gap: 5px; margin: 22px 0 14px; }
  .pieces i { height: 26px; border-radius: 4px; background: var(--line); }
  .pieces i.hit { background: var(--ok); } .pieces i.miss { background: var(--ng); }
  .result { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .result.ok { color: var(--ok); } .result.bad { color: var(--ng); }
  .result small { font-size: 14px; font-weight: 400; color: var(--sub); margin-left: 10px; letter-spacing: 0; }
  #dlg-report { width: 880px; }
  .rp-top { display: flex; justify-content: space-between; align-items: baseline; }
  .rp-top span { font: 12.5px var(--mono); color: var(--sub); }
  .rp-nums { display: grid; grid-template-columns: repeat(5, 1fr); margin: 22px 0 4px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .rp-nums div { padding: 14px 0 13px 16px; border-left: 1px solid var(--line-soft); }
  .rp-nums div:first-child { border-left: 0; padding-left: 0; }
  .rp-nums b { display: block; font: 600 28px var(--mono); letter-spacing: 0; }
  .rp-nums span { font-size: 12px; color: var(--sub); }
  .rp-nums .ok b { color: var(--ok); } .rp-nums .hold b { color: var(--hold); } .rp-nums .ng b { color: var(--ng); }
  .rp-two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 36px; }
  .rp th.r, .rp td.r { text-align: right; }
  .rp td.r { font-family: var(--mono); }
  .rp h2 { margin-top: 22px; }
  .rp td { padding: 7px 0; }
  .rp td small { color: var(--faint); font-family: Pretendard, "Malgun Gothic", sans-serif; margin-left: 6px; }
  .maps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .maps figure { margin: 0; }
  .maps svg { background: var(--panel); border-radius: 6px; aspect-ratio: 4 / 3; }
  .maps figcaption { font-size: 12px; color: var(--sub); margin-top: 5px; }
  .rp .note { margin-top: 8px; }
  @media print {
    header, main { display: none !important; }
    body { display: block; background: #fff; overflow: visible; }
    dialog#dlg-report { position: static; width: auto; max-height: none; border: 0; box-shadow: none; background: #fff; color: #111; }
    dialog::backdrop { background: #fff; }
    .rp { --bg: #fff; --panel: #f3f5f6; --line: #cfd6da; --line-soft: #e3e8eb; --text: #111; --sub: #4a565c; --faint: #6c7a81; }
    .dlg .acts { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>X-ray 이물 검사</h1>
  <span class="model" id="model"></span>
  <div class="tools">
    <button id="bt-check" hidden>자가 점검</button>
    <button id="bt-report">교대 보고서</button>
  </div>
  <div class="tally">
    <span>검사<b id="n-all">0</b></span>
    <span class="ok">합격<b id="n-합격">0</b></span>
    <span class="hold">재검사<b id="n-재검사">0</b></span>
    <span class="ng">불합격<b id="n-불합격">0</b></span>
  </div>
</header>
<main>
  <section class="list">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="qhead"><span id="qinfo"></span><button id="runall">이 묶음 모두 검사</button></div>
    <div class="rows" id="rows"></div>
    <div class="upload">
      <label>사진 올리기<input type="file" id="file" accept="image/*,.bmp"></label>
      <select id="machine" title="장비">
        <option value="">장비 자동</option><option value="1">1호기</option><option value="2">2호기</option><option value="3">3호기</option>
      </select>
      <p>색 표시가 있는 원본은 표시를 지우고 판정합니다.</p>
    </div>
  </section>

  <section class="view">
    <div class="bar">
      <span class="name" id="name"></span>
      <div class="toggles">
        <button id="tg-box" aria-pressed="true"><i class="b"></i>검출 위치</button>
        <button id="tg-risk" aria-pressed="false"><i class="r"></i>놓치기 쉬운 구역</button>
        <button id="tg-truth" aria-pressed="false"><i class="t"></i>정답 위치</button>
      </div>
    </div>
    <div class="stage" id="stage">
      <canvas id="main"></canvas>
      <div class="lens" id="lens" hidden><canvas id="zoom" width="19" height="19"></canvas><div id="lens-cap"></div></div>
    </div>
  </section>

  <aside class="side">
    <div class="verdict" id="verdict">&nbsp;</div>
    <p class="why" id="why">왼쪽에서 사진을 고르면 판정이 표시됩니다.</p>
    <div class="confirm" id="confirm" hidden></div>

    <h2>이물 점수와 기준선</h2>
    <svg id="scale" viewBox="0 0 316 64" height="64"></svg>

    <h2>검출 위치</h2>
    <div id="signals"></div>

    <h2>놓치기 쉬운 구역</h2>
    <div class="big" id="risk-n">-</div>
    <div class="meter"><i id="risk-bar" style="width:0"></i></div>
    <p class="note">지름 2px, 주변보다 15% 어두운 옅은 이물이 있었다면 놓쳤을 가능성이 높은 자리입니다. 재검사 때 먼저 볼 곳입니다.</p>

    <h2>처리</h2>
    <div class="kv">
      <span>장비</span><b id="k-machine">-</b>
      <span>사진 크기</span><b id="k-size">-</b>
      <span>판정 시간</span><b id="k-infer">-</b>
      <span>구역 계산</span><b id="k-explain">-</b>
    </div>
    <p class="note" id="guarantee" style="margin-top:22px"></p>
  </aside>
</main>

<dialog id="dlg-check"><div class="dlg">
  <h3>자가 점검</h3>
  <p class="lead">정상 사진 20장에 사양 진하기의 가상 시험편(지름 2px)을 하나씩 넣고, 지금도 잡는지 확인합니다.</p>
  <div class="pieces" id="pieces"></div>
  <div class="result" id="ck-result">&nbsp;</div>
  <p class="note" id="ck-note">&nbsp;</p>
  <div class="acts">
    <select id="ck-level" class="sp" title="조건">
      <option value="0">평상시</option><option value="0.5">모의 열화 (흐림 · 잡음 중간)</option><option value="0.7">모의 열화 (흐림 · 잡음 심함)</option>
    </select>
    <button id="ck-close">닫기</button><button id="ck-run" class="go">점검 시작</button>
  </div>
</div></dialog>

<dialog id="dlg-report"><div class="dlg rp" id="report"></div></dialog>

<script>
const $ = id => document.getElementById(id);
const COLOR = { 합격: '#35c2a4', 재검사: '#f0a63c', 불합격: '#ef5b52' };
const st = { info: null, kind: 'ng', cur: null, res: null, sel: 0, img: null, risk: null, seen: {}, top: {}, cnt: {}, conf: {}, seq: 0, show: { box: true, risk: false, truth: false } };

function label(id) {
  const m = id.match(/^m(\d)_\d+_(\d{4})(\d\d)(\d\d)_(\d\d)(\d\d)(\d\d)\((\d+)\)/);
  return m ? { t1: `${m[3]}월 ${m[4]}일 ${m[5]}:${m[6]}:${m[7]}`, t2: `${m[1]}호기 · ${m[8]}번` } : { t1: id, t2: '' };
}

async function init() {
  st.info = await (await fetch('/api/info')).json();
  $('model').textContent = `최종 모델 ${st.info.model} · 합격선 ${st.info.t_low.toFixed(2)} · 불합격선 ${st.info.t_high.toFixed(2)}`;
  $('guarantee').textContent = '기준선 보장: ' + st.info.guarantee;
  $('tabs').innerHTML = Object.entries(st.info.kinds).filter(([k]) => st.info.samples[k].length || (k === 'watch' && st.info.watch))
    .map(([k, v]) => `<button role="tab" data-k="${k}">${v}</button>`).join('') + '<button role="tab" data-k="queue">재검사 대기</button>';
  $('runall').onclick = runAll;
  $('tabs').onclick = e => { if (e.target.dataset.k) { st.kind = e.target.dataset.k; rows(); } };
  $('bt-check').hidden = !st.info.check;
  $('bt-check').onclick = () => { $('pieces').innerHTML = '<i></i>'.repeat(20); $('ck-result').innerHTML = '&nbsp;'; $('ck-result').className = 'result'; $('ck-note').innerHTML = '&nbsp;'; $('dlg-check').showModal(); };
  $('ck-close').onclick = () => $('dlg-check').close();
  $('ck-run').onclick = selfCheck;
  $('bt-report').onclick = openReport;
  await sync();                     // 서버가 이미 판정해 둔 것(폴더 감시 · 새로 고침 전의 검사)을 이어받는다
  rows();
  drawScale();
  const first = st.info.samples[st.kind][0];
  if (first) pick(st.kind, first.id);
  setInterval(async () => { if (await sync()) rows(); }, 2000);
}

// 서버의 판정 기록 · 확정 내용을 가져와 맞춘다. 바뀐 것이 있으면 true
async function sync() {
  const d = await (await fetch('/api/session?since=' + st.seq)).json();
  let changed = false;
  for (const r of d.records) {
    if (r.kind === 'watch' && !st.info.samples.watch.some(s => s.id === r.id)) st.info.samples.watch.push({ id: r.id, machine: r.machine });
    if (!st.seen[r.kind + '/' + r.id]) { record({ kind: r.kind, id: r.id, verdict: r.verdict, top: r.top, boxes: { length: r.n }, weak: { length: r.weak } }); changed = true; }
  }
  st.seq = d.seq;
  if (JSON.stringify(d.confirm) !== JSON.stringify(st.conf)) { st.conf = d.confirm; changed = true; }
  return changed;
}

// 지금 목록에 보일 항목: 묶음이면 그 사진들, '재검사 대기'면 검사한 사진 중 합격이 아닌 것을 점수 높은 순으로
// 재검사 대기의 우선순위: 1순위 = 재검사 구간(점수 높은 순, 같으면 신호가 많은 순),
// 2순위 = 합격했지만 약한 신호(하한 이상)가 있는 제품(점수 높은 순). 불합격은 자동 배출이라 건수만 센다.
function tiers() {
  const keys = Object.keys(st.seen).filter(k => !k.startsWith('upload/'));
  const obj = k => ({ kind: k.slice(0, k.indexOf('/')), id: k.slice(k.indexOf('/') + 1) });
  const order = (a, b) => (st.top[b] - st.top[a]) || (st.cnt[b] - st.cnt[a]);
  return {
    t1: keys.filter(k => st.seen[k] === '재검사' && !st.conf[k]).sort(order).map(obj),
    t2: keys.filter(k => st.seen[k] === '합격' && st.top[k] >= st.info.weak && !st.conf[k]).sort(order).map(obj),
    auto: keys.filter(k => st.seen[k] === '불합격').length,
    done: keys.filter(k => st.conf[k]).length,          // 사람이 확정한 것은 대기 목록에서 빠진다
  };
}

function items() {
  if (st.kind !== 'queue') return st.info.samples[st.kind].map(s => ({ kind: st.kind, id: s.id }));
  const t = tiers();
  return [...t.t1, ...t.t2];
}

function rows() {
  [...$('tabs').children].forEach(b => b.setAttribute('aria-selected', b.dataset.k === st.kind));
  const list = items(), q = st.kind === 'queue';
  $('runall').style.display = q || st.kind === 'watch' ? 'none' : '';
  const row = s => {
    const l = label(s.id), key = s.kind + '/' + s.id;
    return `<button class="row" data-kind="${s.kind}" data-id="${encodeURIComponent(s.id)}" aria-current="${st.cur === key}">
      <img loading="lazy" src="/api/thumb?kind=${s.kind}&id=${encodeURIComponent(s.id)}" alt="">
      <span><div class="t1">${l.t1}</div><div class="t2">${q ? l.t2.split(' · ')[0] + ' · ' + st.info.kinds[s.kind] : l.t2}</div></span>
      ${q ? `<span class="sc">${st.top[key].toFixed(2)}</span>` : st.conf[key] ? `<span class="ck ${st.conf[key]}">${st.conf[key] === '이물' ? '폐기' : '통과'}</span>` : `<span class="dot ${st.seen[key] || ''}"></span>`}</button>`;
  };
  if (q) {
    const t = tiers();
    $('qinfo').textContent = list.length ? '점수 높은 순' : '검사한 사진 가운데 사람이 볼 것이 여기에 쌓입니다';
    $('rows').innerHTML = (t.t1.length ? `<div class="grp"><span>1순위 · 재검사 (반드시 확인)</span><b>${t.t1.length}</b></div>` + t.t1.map(row).join('') : '')
      + (t.t2.length ? `<div class="grp"><span>2순위 · 약한 신호 (여유 있을 때)</span><b>${t.t2.length}</b></div>` + t.t2.map(row).join('') : '')
      + (t.auto ? `<div class="grp auto"><span>자동 배출 (사람 확인 없음)</span><b>${t.auto}</b></div>` : '')
      + (t.done ? `<div class="grp auto"><span>작업자 확정 끝남</span><b>${t.done}</b></div>` : '');
  } else {
    $('qinfo').textContent = st.kind === 'watch' ? `폴더 감시 중 (${st.info.watch}) · ${list.length}장` : `${list.length}장`;
    $('rows').innerHTML = list.map(row).join('');
  }
  $('rows').onclick = e => { const r = e.target.closest('.row'); if (r) pick(r.dataset.kind, decodeURIComponent(r.dataset.id)); };
}

async function runAll() {
  const kind = st.kind, list = st.info.samples[kind] || [];
  $('runall').disabled = true;
  for (let i = 0; i < list.length; i++) {
    const key = kind + '/' + list[i].id;
    if (!st.seen[key]) {
      const r = await (await fetch(`/api/inspect?kind=${kind}&id=${encodeURIComponent(list[i].id)}&light=1`)).json();
      record(r);
    }
    $('qinfo').textContent = `${i + 1} / ${list.length}장 검사`;
  }
  $('runall').disabled = false;
  rows();
}

function record(res) {
  const key = res.kind + '/' + res.id;
  if (st.seen[key]) return;
  st.seen[key] = res.verdict; st.top[key] = res.top; st.cnt[key] = res.boxes.length;
  $('n-all').textContent = Object.keys(st.seen).length;
  for (const v of ['합격', '재검사', '불합격']) $('n-' + v).textContent = Object.values(st.seen).filter(x => x === v).length;
}

async function pick(kind, id) {
  st.cur = kind + '/' + id;
  const res = await (await fetch(`/api/inspect?kind=${kind}&id=${encodeURIComponent(id)}`)).json();
  if (st.cur !== kind + '/' + id) return;
  show(res);
}

async function show(res) {
  st.res = res; st.sel = 0;
  record(res);
  [st.img, st.risk] = await Promise.all([load(res.image), load(res.risk)]);
  rowsMark();
  const l = label(res.id);
  $('name').textContent = res.kind === 'upload' ? res.id + (res.cleaned ? '  ·  색 표시 지움' : '') : `${l.t2} · ${l.t1}`;
  $('tg-truth').style.display = res.truth ? '' : 'none';
  panel();
  draw();
}

function rowsMark() {
  [...$('rows').querySelectorAll('.row')].forEach(r => {
    const key = r.dataset.kind + '/' + decodeURIComponent(r.dataset.id);
    r.setAttribute('aria-current', key === st.cur);
    if (st.kind !== 'queue' && !st.conf[key]) r.lastElementChild.className = 'dot ' + (st.seen[key] || '');
  });
}

const load = src => new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.src = src; });

function panel() {
  const r = st.res, n = r.boxes.length;
  const v = $('verdict'); v.textContent = r.verdict; v.className = 'verdict ' + r.verdict;
  $('why').textContent = r.verdict === '합격'
    ? (r.weak.length ? `합격선 ${r.t_low.toFixed(2)}을 넘는 신호는 없지만 약한 신호가 ${r.weak.length}곳 있습니다(최고 ${r.top.toFixed(2)}). 여유가 있을 때 확인을 권합니다.`
      : `합격선 ${r.t_low.toFixed(2)}을 넘는 신호가 없습니다. 가장 높은 점수는 ${r.top.toFixed(2)}입니다.`)
    : r.verdict === '재검사'
      ? `이물로 보이는 신호가 ${n}곳 있습니다. 사람이 확인한 뒤 결정합니다.`
      : `뚜렷한 이물 신호가 있습니다. 표시된 ${n}곳을 확인하고 폐기합니다.`;
  confirmBox();
  drawScale();
  $('signals').innerHTML = n ? `<table><thead><tr><th></th><th>점수</th><th>판정</th><th style="padding-left:14px">자리</th></tr></thead><tbody>` +
    r.boxes.map((b, i) => `<tr class="sig" data-i="${i}" aria-selected="${i === st.sel}"><td class="no">${i + 1}</td><td class="sc">${b.score.toFixed(2)}</td>
      <td class="vd ${b.verdict}">${b.verdict}</td>
      <td class="at">${b.band ? '어두운 띠 안' : '띠 밖'} · 가장자리에서 ${Math.round(b.edge)}px · 주변 결 ${b.texture}</td></tr>`).join('') + '</tbody></table>'
    : (r.weak.length ? '<p class="none">합격선을 넘는 신호는 없습니다. 점선으로 표시한 약한 신호: '
        + r.weak.map(b => b.score.toFixed(2)).join(' · ') + '</p>' : '<p class="none">합격선을 넘는 신호가 없습니다.</p>');
  $('signals').onclick = e => { const t = e.target.closest('.sig'); if (t) { st.sel = +t.dataset.i; panel(); draw(); } };
  $('risk-n').innerHTML = `${(r.risk_area * 100).toFixed(0)}%<small>제품 면적 가운데</small>`;
  $('risk-bar').style.width = Math.min(100, r.risk_area * 100) + '%';
  $('k-machine').textContent = r.machine + '호기';
  $('k-size').textContent = `${r.w} × ${r.h}`;
  $('k-infer').textContent = r.ms.infer.toFixed(0) + ' ms';
  $('k-explain').textContent = r.ms.explain.toFixed(0) + ' ms';
}

// 작업자 확정: 사람이 볼 제품(재검사 · 불합격 · 약한 신호)에만 단추를 보인다. 결과는 서버가 demo/log/confirm.csv 에 쌓는다
function confirmBox() {
  const r = st.res, box = $('confirm'), key = st.cur;
  const need = r && r.kind !== 'upload' && (r.verdict !== '합격' || r.weak.length);
  box.hidden = !need;
  if (!need) return;
  const c = st.conf[key];
  box.innerHTML = c
    ? `<div class="done"><span>작업자 확정 <b class="${c}">${c === '이물' ? '이물 맞음 · 폐기' : '이물 아님 · 통과'}</b></span><button data-d="취소">되돌리기</button></div>`
    : `<div class="ask"><button class="yes" data-d="이물">이물 맞음<kbd>1</kbd></button><button class="no" data-d="정상">이물 아님<kbd>2</kbd></button></div>
       <p>확정 결과는 기록으로 쌓여 다음 학습과 기준선 점검에 쓰입니다.</p>`;
  box.onclick = e => { const d = e.target.closest('button')?.dataset.d; if (d) confirmAs(d); };
}

async function confirmAs(dec) {
  const r = st.res;
  if (!r || $('confirm').hidden || (st.conf[st.cur] && dec !== '취소')) return;
  const key = st.cur, before = items(), at = before.findIndex(s => s.kind + '/' + s.id === key);
  const res = await (await fetch(`/api/confirm?kind=${r.kind}&id=${encodeURIComponent(r.id)}&decision=${encodeURIComponent(dec)}`, { method: 'POST' })).json();
  if (res.error) return;
  if (res.decision) st.conf[key] = res.decision; else delete st.conf[key];
  rows();
  const next = st.kind === 'queue' && res.decision ? items()[Math.min(at, items().length - 1)] : null;   // 대기 목록에서는 다음 제품으로 넘어간다
  if (next) pick(next.kind, next.id); else confirmBox();
}

async function selfCheck() {
  const run = $('ck-run'); run.disabled = true; run.textContent = '점검 중';
  $('pieces').innerHTML = '<i></i>'.repeat(20); $('ck-result').innerHTML = '&nbsp;'; $('ck-note').innerHTML = '&nbsp;';
  const r = await (await fetch('/api/selfcheck?level=' + $('ck-level').value)).json();
  run.disabled = false; run.textContent = '다시 점검';
  if (r.error) { $('ck-note').textContent = r.error; return; }
  $('pieces').innerHTML = r.pieces.map(p => `<i class="${p.hit ? 'hit' : 'miss'}" title="${p.machine}호기 · 진하기 ${p.c0}"></i>`).join('');
  $('ck-result').className = 'result ' + (r.ok ? 'ok' : 'bad');
  $('ck-result').innerHTML = `${r.ok ? '정상' : '점검 필요'}<small>${r.n}개 중 ${r.hits}개 검출 · 경보 하한 ${r.lcl}개</small>`;
  $('ck-note').textContent = (r.level > 0 ? '모의 열화 조건입니다(실제 장비 자료가 아닙니다). ' : '')
    + (r.ok ? `평상시 검출률 ${(r.base * 100).toFixed(0)}% 기준으로 정상 범위입니다.` : '검출 수가 경보 하한 아래입니다. 한 번 더 점검해 같은 결과면 장비 상태와 모델을 확인하세요.') + ` (${r.sec}초)`;
}

      + `</svg><figcaption>${m}호기 · 신호 ${pts.length}곳</figcaption></figure>`;
  }).join('');

    <div class="rp-nums">
      <div><b>${r.n}</b><span>검사한 제품</span></div>
      <div class="ok"><b>${r.ok}</b><span>합격 ${pct(r.ok, r.n)}</span></div>
      <div class="hold"><b>${r.hold}</b><span>재검사 ${pct(r.hold, r.n)}</span></div>
      <div class="ng"><b>${r.ng}</b><span>불합격 (자동 배출)</span></div>
      <div><b>${r.weak}</b><span>합격 중 약한 신호</span></div>
    </div>
    <h2>호기별</h2>
    <table><thead><tr><th>호기</th><th class="r">검사</th><th class="r">사람이 볼 제품</th><th class="r">신호 수</th><th class="r">신호 있는 제품당</th><th class="r">띠 밖 신호</th></tr></thead><tbody>`
    + (r.machines.map(m => `<tr><td>${m.machine}호기</td><td class="r">${m.n}</td><td class="r">${m.hold}<small>${pct(m.hold, m.n)}</small></td><td class="r">${m.signals}</td>
        <td class="r">${m.per ?? '-'}${m.base ? `<small>기준 ${m.base.per.toFixed(1)}</small>` : ''}</td>
        <td class="r">${m.off == null ? '-' : (m.off * 100).toFixed(1) + '%'}${m.base ? `<small>기준 ${(m.base.off * 100).toFixed(1)}%</small>` : ''}</td></tr>`).join('')
       || '<tr><td colspan="6" class="none">아직 검사한 제품이 없습니다.</td></tr>') + `</tbody></table>
    <p class="note">기준 = 학습 자료 앞 30% 기간의 값(process_signal.py). 묶음이 작을 때는 참고로만 봅니다.</p>
    <div class="rp-two">
      <div><h2>신호가 나온 자리 (제품 외곽 상자 기준)</h2><div class="maps">${maps}</div>
        <h2>자가 점검</h2>${checks}</div>
      <div><h2>자리의 성질</h2>

          <span>가장자리까지 거리 (중앙값)</span><b>${r.edge == null ? '-' : r.edge + ' px'}</b>
          <span>주변 결 매끈 · 중간 · 거침</span><b>${r.texture['매끈']} · ${r.texture['중간']} · ${r.texture['거침']}</b>
          <span>판정 시간 (중앙값)</span><b>${r.infer == null ? '-' : r.infer + ' ms'}</b></div>
        <h2>작업자 확정</h2>
        <div class="kv"><span>확정한 제품 / 사람이 볼 제품</span><b>${c.done} / ${c.target}</b>
          <span>이물 맞음 (폐기)</span><b>${c.yes}</b><span>이물 아님 (통과)</span><b>${c.no}</b></div>
      </div>
    </div>
    <div class="acts"><button onclick="window.print()">인쇄</button><button class="go" onclick="document.getElementById('dlg-report').close()">닫기</button></div>`;

function drawScale() {
  const W = 316, x = s => 4 + s * (W - 8), i = st.info, r = st.res;
  if (!i) return;
  let s = `<rect x="${x(0)}" y="26" width="${x(i.t_low) - x(0) - 1}" height="6" rx="3" fill="#35c2a4" opacity=".28"/>
    <rect x="${x(i.t_low) + 1}" y="26" width="${x(i.t_high) - x(i.t_low) - 2}" height="6" fill="#f0a63c" opacity=".34"/>
    <rect x="${x(i.t_high) + 1}" y="26" width="${x(1) - x(i.t_high) - 1}" height="6" rx="3" fill="#ef5b52" opacity=".34"/>`;
  for (const [t, name, tx] of [[i.t_low, '합격선', x(i.t_low) - 6], [i.t_high, '불합격선', W - 2]])
    s += `<line x1="${x(t)}" x2="${x(t)}" y1="18" y2="40" stroke="#93a3ab" stroke-width="1"/>
      <text class="k" x="${tx}" y="56" text-anchor="end">${name} <tspan style="font-family:var(--mono)">${t.toFixed(2)}</tspan></text>`;
  if (r) {
    r.boxes.slice().reverse().forEach((b, k) => {
      const idx = r.boxes.length - 1 - k;
      s += `<circle cx="${x(b.score)}" cy="29" r="${idx === st.sel ? 6 : 4.5}" fill="${COLOR[b.verdict]}" stroke="#0e1316" stroke-width="2"/>`;
    });
    if (!r.boxes.length) s += `<circle cx="${x(r.top)}" cy="29" r="5" fill="#35c2a4" stroke="#0e1316" stroke-width="2"/>`;
    const top = r.boxes.length ? r.boxes[st.sel].score : r.top;
    s += `<text x="${Math.min(W - 14, Math.max(14, x(top)))}" y="11" text-anchor="middle" style="fill:#e8eef0;font-size:12px">${top.toFixed(2)}</text>`;
  }
  $('scale').innerHTML = s;
}

function draw() {
  const r = st.res, c = $('main'), stage = $('stage');
  if (!r || !st.img) return;
  const availW = stage.clientWidth - 48, availH = stage.clientHeight - 48;
  const k = Math.min(availW / r.w, availH / r.h), dpr = window.devicePixelRatio || 1;
  const cw = Math.floor(r.w * k), ch = Math.floor(r.h * k);
  c.style.width = cw + 'px'; c.style.height = ch + 'px';
  c.width = cw * dpr; c.height = ch * dpr;
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(st.img, 0, 0, cw, ch);
  if (st.show.risk) g.drawImage(st.risk, 0, 0, cw, ch);
  if (st.show.truth && r.truth) {
    g.setLineDash([4, 3]); g.lineWidth = 1; g.strokeStyle = '#cfd8dc';
    for (const [x0, y0, x1, y1] of r.truth) g.strokeRect(x0 * k - 5, y0 * k - 5, (x1 - x0) * k + 10, (y1 - y0) * k + 10);
    g.setLineDash([]);
  }
  if (st.show.box && !r.boxes.length) {             // 합격 제품의 약한 신호: 회색 점선 네모 (확인 권장)
    g.setLineDash([3, 3]); g.lineWidth = 1.2; g.strokeStyle = '#93a3ab';
    for (const b of r.weak) g.strokeRect(b.x0 * k - 7, b.y0 * k - 7, (b.x1 - b.x0) * k + 14, (b.y1 - b.y0) * k + 14);
    g.setLineDash([]);
  }
  if (st.show.box) r.boxes.forEach((b, i) => {
    const pad = 7, x0 = b.x0 * k - pad, y0 = b.y0 * k - pad, w = (b.x1 - b.x0) * k + 2 * pad, h = (b.y1 - b.y0) * k + 2 * pad, L = Math.min(9, w / 3);
    g.strokeStyle = COLOR[b.verdict]; g.lineWidth = i === st.sel ? 2.5 : 1.5;
    g.beginPath();
    for (const [cx, cy, sx, sy] of [[x0, y0, 1, 1], [x0 + w, y0, -1, 1], [x0, y0 + h, 1, -1], [x0 + w, y0 + h, -1, -1]]) {
      g.moveTo(cx + sx * L, cy); g.lineTo(cx, cy); g.lineTo(cx, cy + sy * L);
    }
    g.stroke();
    g.font = '600 12px "JetBrains Mono", Consolas, monospace'; g.fillStyle = COLOR[b.verdict];
    g.textBaseline = 'bottom';
    const below = y0 < 18;
    g.fillText(String(i + 1), x0, below ? y0 + h + 16 : y0 - 4);
  });
  lens();
}

function lens() {
  const r = st.res, b = r.boxes[st.sel];
  $('lens').hidden = !b;
  if (!b) return;
  const z = $('zoom').getContext('2d'), cx = Math.round((b.x0 + b.x1) / 2), cy = Math.round((b.y0 + b.y1) / 2);
  z.imageSmoothingEnabled = false;
  z.fillStyle = '#000'; z.fillRect(0, 0, 19, 19);
  z.drawImage(st.img, cx - 9, cy - 9, 19, 19, 0, 0, 19, 19);
  $('lens-cap').textContent = `${st.sel + 1}번 위치 8배 확대`;
}

for (const k of ['box', 'risk', 'truth']) $('tg-' + k).onclick = e => {
  st.show[k] = !st.show[k]; e.currentTarget.setAttribute('aria-pressed', st.show[k]); draw();
};
window.addEventListener('resize', draw);
window.addEventListener('keydown', e => {
  if (document.querySelector('dialog[open]')) return;
  if (e.key === '1' || e.key === '2') return confirmAs(e.key === '1' ? '이물' : '정상');
  if (!['ArrowDown', 'ArrowUp'].includes(e.key) || !st.info) return;
  const list = items(), i = list.findIndex(s => s.kind + '/' + s.id === st.cur);
  const n = list[Math.max(0, Math.min(list.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
  if (n) { e.preventDefault(); pick(n.kind, n.id).then(() => document.querySelector('.row[aria-current="true"]')?.scrollIntoView({ block: 'nearest' })); }
});
$('file').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  st.cur = 'upload/' + f.name;
  const res = await (await fetch(`/api/upload?name=${encodeURIComponent(f.name)}&machine=${$('machine').value}`, { method: 'POST', body: f })).json();
  e.target.value = '';
  if (res.error) { $('why').textContent = res.error; return; }
  show(res);
};
init();
</script>
